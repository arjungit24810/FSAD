<!DOCTYPE html>
<html>
<head>
    <title>My 3D Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f2027;
            color: white;
            overflow-x: hidden;
        }

        /* 3D Background */
        .background {
            position: fixed;
            width: 100%;
            height: 100vh;
            perspective: 1000px;
            z-index: -1;
        }


        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            transition: 0.3s;
        }

        nav a:hover {
            color: cyan;
        }

        section {
            padding: 100px 40px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            margin: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: 0.4s;
            display: inline-block;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
        }

        input, button {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            background: cyan;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: white;
        }

        footer {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.7);
        }
    </style>
</head>

<body>

<!-- 3D Background -->
<div class="background">
    <div class="cube" style="top:20%; left:15%;">
        <div class="front"></div>
        <div class="back"></div>
        <div class="left"></div>
        <div class="right"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>

    <div class="cube" style="top:60%; left:70%; animation-duration:15s;">
        <div class="front"></div>
        <div class="back"></div>
        <div class="left"></div>
        <div class="right"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>
</div>

<header>
    <h1>My Portfolio</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home">
    <h2>Welcome</h2>
    <p>I am a Full Stack Web Developer 🚀</p>
</section>

<section id="about">
    <h2>About Me</h2>
    <p>I build modern, dynamic and scalable web applications.</p>
</section>

<section id="projects">
    <h2>Projects</h2>
    <div class="card">AutoMod Marketplace</div>
    <div class="card">Smart Complaint Management</div>
</section>

<section id="contact">
    <h2>Contact</h2>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <br>
    <button onclick="submitForm()">Submit</button>
</section>

<footer>
    <p>© 2026 My 3D Portfolio</p>
</footer>

<script>
    function submitForm() {
        alert("Thank you! I will contact you soon.");
    }
</script>

</body>
</html>
